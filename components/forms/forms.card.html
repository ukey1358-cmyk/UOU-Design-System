<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--gray-0); font-family: var(--font-sans); }
  .label { font-size: 11px; font-weight: 700; color: var(--gray-500); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 12px; }
  .group { margin-bottom: 22px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 560px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Input } = window.UOUDesignSystem_08270e;
    function Demo() {
      return (
        <div>
          <div className="group">
            <p className="label">Button · variants</p>
            <div className="row">
              <Button variant="primary">신청하기</Button>
              <Button variant="secondary">자세히 보기</Button>
              <Button variant="outline">취소</Button>
              <Button variant="text">더보기</Button>
              <Button variant="danger">삭제</Button>
              <Button variant="primary" disabled>비활성</Button>
            </div>
          </div>
          <div className="group">
            <p className="label">Button · sizes</p>
            <div className="row">
              <Button variant="primary" size="sm">Small</Button>
              <Button variant="primary" size="md">Medium</Button>
              <Button variant="primary" size="lg">Large</Button>
            </div>
          </div>
          <div className="group">
            <p className="label">Input</p>
            <div className="inputs">
              <Input placeholder="통합검색어 입력" />
              <Input defaultValue="홍길동" />
              <Input invalid placeholder="필수 항목" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
