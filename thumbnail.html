<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>UOU Design System</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;overflow:hidden}.tile{display:grid;grid-template-columns:1fr 300px;width:1280px;height:854px}.main{background:var(--uou-green,#009A44);display:flex;align-items:center;justify-content:center;padding:0 64px}.name{font-family:var(--font-sans);font-weight:800;font-size:118px;line-height:1;letter-spacing:-.03em;color:#fff;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}</style>
</head><body>
<div class="tile">
<div class="main"><div class="name">UOU</div></div>
<div class="strip"><div style="background:#E3C25C"></div><div style="background:#CC9900"></div><div style="background:#006E30"></div><div style="background:#333333"></div></div>
</div>
</body></html>
