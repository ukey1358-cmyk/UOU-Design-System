<!-- @dsCard group="Colors" viewport="700x150" name="Neutral · Gray scale" subtitle="텍스트·보더·배경 — 800은 UOU Gray 본문" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--gray-0); font-family: var(--font-sans); }
  .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .cell .chip { height: 60px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.08); }
  .cell .k { font-size: 11px; font-weight: 700; color: var(--gray-800); margin-top: 6px; }
  .cell .h { font-family: var(--font-mono); font-size: 9px; color: var(--gray-500); }
  .star { color: var(--green-600); }
</style>
</head>
<body>
  <div class="scale">
    <div class="cell"><div class="chip" style="background:var(--gray-0)"></div><div class="k">0</div><div class="h">FFFFFF</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-50)"></div><div class="k">50</div><div class="h">F7F8F8</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-100)"></div><div class="k">100</div><div class="h">EFF0F1</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-200)"></div><div class="k">200</div><div class="h">DCDEE0</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-300)"></div><div class="k">300</div><div class="h">C2C5C8</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-400)"></div><div class="k">400</div><div class="h">9A9EA3</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-500)"></div><div class="k">500</div><div class="h">71767B</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-600)"></div><div class="k">600</div><div class="h">565B60</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-700)"></div><div class="k">700</div><div class="h">3F4348</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-800)"></div><div class="k">800 <span class="star">★</span></div><div class="h">333333</div></div>
    <div class="cell"><div class="chip" style="background:var(--gray-900)"></div><div class="k">900</div><div class="h">1C1E20</div></div>
  </div>
</body>
</html>
