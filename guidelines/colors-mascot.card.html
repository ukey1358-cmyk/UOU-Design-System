<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--gray-0); font-family: var(--font-sans); }
  .scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cell .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06); }
  .cell .k { font-size: 11px; font-weight: 700; color: var(--gray-800); margin-top: 6px; }
  .cell .h { font-family: var(--font-mono); font-size: 9px; color: var(--gray-500); }
</style>
</head>
<body>
  <div class="scale">
    <div class="cell"><div class="chip" style="background:var(--ulrinee-green-light)"></div><div class="k">밝은 연두</div><div class="h">B9D887</div></div>
    <div class="cell"><div class="chip" style="background:var(--ulrinee-green)"></div><div class="k">기본 연두</div><div class="h">99C45C</div></div>
    <div class="cell"><div class="chip" style="background:var(--ulrinee-green-dark)"></div><div class="k">진한 연두</div><div class="h">76A854</div></div>
    <div class="cell"><div class="chip" style="background:var(--ulrinee-outline)"></div><div class="k">외곽선</div><div class="h">2C3D28</div></div>
    <div class="cell"><div class="chip" style="background:var(--ulrinee-yellow)"></div><div class="k">옐로우</div><div class="h">F9E79B</div></div>
    <div class="cell"><div class="chip" style="background:var(--ulrinee-beige)"></div><div class="k">베이지</div><div class="h">EDBE7F</div></div>
    <div class="cell"><div class="chip" style="background:var(--ulrinee-coral)"></div><div class="k">코랄</div><div class="h">F08C8C</div></div>
  </div>
</body>
</html>
