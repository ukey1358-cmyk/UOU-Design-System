<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--gray-0); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .frame { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--gray-50); border-radius: var(--radius-md); padding: 6px; box-sizing: border-box; }
  .frame img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cap { font-size: 10px; color: var(--gray-500); font-weight: 600; text-align: center; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/cheer.png"></div><span class="cap">응원</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/heart.png"></div><span class="cap">하트</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/thumbs-up.png"></div><span class="cap">엄지척</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/greeting.png"></div><span class="cap">인사</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/sulking.png"></div><span class="cap">삐짐</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/late-night.png"></div><span class="cap">야작</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/graduation.png"></div><span class="cap">졸업식</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/campus-tour.png"></div><span class="cap">캠퍼스탐방</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/coffee.png"></div><span class="cap">커피</span></div>
    <div class="item"><div class="frame"><img src="../assets/mascot/poses-3d/varsity-jacket.png"></div><span class="cap">과잠</span></div>
  </div>
</body>
</html>
