<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--gray-0); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .cell { text-align: center; }
  .bar { background: var(--green-500); border-radius: 2px; width: 100%; }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--gray-500); margin-top: 8px; }
  .px { font-size: 11px; font-weight: 700; color: var(--gray-800); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell" style="width:30px"><div class="bar" style="height:4px"></div><div class="px">4</div><div class="t">1</div></div>
    <div class="cell" style="width:34px"><div class="bar" style="height:8px"></div><div class="px">8</div><div class="t">2</div></div>
    <div class="cell" style="width:38px"><div class="bar" style="height:12px"></div><div class="px">12</div><div class="t">3</div></div>
    <div class="cell" style="width:42px"><div class="bar" style="height:16px"></div><div class="px">16</div><div class="t">4</div></div>
    <div class="cell" style="width:48px"><div class="bar" style="height:24px"></div><div class="px">24</div><div class="t">5</div></div>
    <div class="cell" style="width:54px"><div class="bar" style="height:32px"></div><div class="px">32</div><div class="t">6</div></div>
    <div class="cell" style="width:64px"><div class="bar" style="height:48px"></div><div class="px">48</div><div class="t">7</div></div>
    <div class="cell" style="width:76px"><div class="bar" style="height:64px"></div><div class="px">64</div><div class="t">8</div></div>
    <div class="cell" style="width:96px"><div class="bar" style="height:96px"></div><div class="px">96</div><div class="t">9</div></div>
  </div>
</body>
</html>
