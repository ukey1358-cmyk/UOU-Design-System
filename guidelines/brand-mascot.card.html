<!-- @dsCard group="Brand" viewport="700x320" name="마스코트 · 울리니 (Ulrinee)" subtitle="울산대(Ul) + 기린(Kirin) + 리니 · 공식 2D 턴어라운드" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--gray-0); font-family: var(--font-sans); }
  .top { display: flex; gap: 24px; align-items: center; }
  .hero { flex: none; width: 150px; height: 200px; display: flex; align-items: center; justify-content: center; background: var(--gray-50); border-radius: var(--radius-lg); }
  .hero img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .info { flex: 1; }
  .name { font-size: 24px; font-weight: 800; color: var(--gray-900); margin: 0; }
  .sub { font-size: 13px; color: var(--gray-500); margin: 4px 0 14px; }
  .pal { display: flex; gap: 6px; margin-bottom: 14px; }
  .sw { width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,.06); }
  .turn { display: flex; gap: 4px; align-items: flex-end; }
  .turn img { height: 76px; width: auto; object-fit: contain; }
  .note { font-size: 12px; line-height: 18px; color: var(--gray-600); margin: 0; }
</style>
</head>
<body>
  <div class="top">
    <div class="hero"><img src="../assets/mascot/ulrinee-front.png" alt="울리니 정면"></div>
    <div class="info">
      <p class="name">울리니 <span style="font-weight:500;color:var(--gray-500);font-size:16px">Ulrinee</span></p>
      <p class="sub">생일 11.11 · MBTI ENFJ · 진리의 빛 · 자주의 바람 · 봉사의 손길</p>
      <div class="pal">
        <div class="sw" style="background:var(--ulrinee-green-light)"></div>
        <div class="sw" style="background:var(--ulrinee-green)"></div>
        <div class="sw" style="background:var(--ulrinee-green-dark)"></div>
        <div class="sw" style="background:var(--ulrinee-outline)"></div>
        <div class="sw" style="background:var(--ulrinee-yellow)"></div>
        <div class="sw" style="background:var(--ulrinee-beige)"></div>
        <div class="sw" style="background:var(--ulrinee-coral)"></div>
      </div>
      <div class="turn">
        <img src="../assets/mascot/ulrinee-side-left.png" alt="왼쪽 옆면">
        <img src="../assets/mascot/ulrinee-45-left.png" alt="왼쪽 45도">
        <img src="../assets/mascot/ulrinee-front.png" alt="정면">
        <img src="../assets/mascot/ulrinee-45-right.png" alt="오른쪽 45도">
        <img src="../assets/mascot/ulrinee-side-right.png" alt="오른쪽 옆면">
        <img src="../assets/mascot/ulrinee-back.png" alt="뒷면">
      </div>
    </div>
  </div>
  <p class="note" style="margin-top:16px">파스텔 그린 전용 팔레트(코퍼레이트 그린과 혼용 금지) · 형태·비례·색상 변형 금지(늘리기·압축·회전·리컬러).</p>
</body>
</html>
