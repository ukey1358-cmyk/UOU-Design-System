<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--gray-0); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1.1fr 1fr 1.2fr; gap: 24px; align-items: start; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { font-size: 11px; font-weight: 700; color: var(--gray-500); letter-spacing: .04em; text-transform: uppercase; }
  .frame { background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: var(--radius-md); width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .marks { display: flex; gap: 18px; align-items: center; }
  .note { font-size: 11px; color: var(--gray-500); margin: 16px 0 0; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell">
      <span class="label">심볼마크</span>
      <div class="frame"><img src="../assets/logo/symbol-mark.png" alt="심볼마크"></div>
    </div>
    <div class="cell">
      <span class="label">로고마크 · U·O·U</span>
      <div class="frame">
        <div class="marks">
          <img src="../assets/logo/logomark-solid.png" alt="로고마크 면" style="height:48px">
          <img src="../assets/logo/logomark-outline.png" alt="로고마크 선" style="height:48px">
        </div>
      </div>
    </div>
    <div class="cell">
      <span class="label">시그니처 기본형</span>
      <div class="frame"><img src="../assets/logo/signature-sheet.png" alt="시그니처 기본형"></div>
    </div>
  </div>
  <p class="note">형태·굵기·비례·자간·색상 변형 금지 · 외부 사용 시 대외홍보팀(052-259-2627) 승인 필요.</p>
</body>
</html>
