<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--gray-0); font-family: var(--font-sans); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--gray-100); }
  .row:last-child { border-bottom: 0; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--gray-400); width: 96px; flex: none; }
  .spec { color: var(--gray-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="row"><span class="tag">display 48/56</span><span class="spec" style="font-size:34px;line-height:1;font-weight:700">울산대학교</span></div>
  <div class="row"><span class="tag">h1 36/44</span><span class="spec" style="font-size:28px;line-height:1;font-weight:700">진리 · 자주 · 봉사</span></div>
  <div class="row"><span class="tag">h2 28/36</span><span class="spec" style="font-size:23px;line-height:1;font-weight:700">섹션 제목입니다</span></div>
  <div class="row"><span class="tag">h3 24/32</span><span class="spec" style="font-size:20px;line-height:1;font-weight:700">서브 섹션 제목</span></div>
  <div class="row"><span class="tag">body 16/26</span><span class="spec" style="font-size:16px;line-height:1;font-weight:400;color:var(--gray-800)">기본 본문 텍스트 — 높은 가독성을 유지합니다.</span></div>
  <div class="row"><span class="tag">caption 12/18</span><span class="spec" style="font-size:12px;line-height:1;font-weight:400;color:var(--gray-500)">캡션 · 메타 정보</span></div>
</body>
</html>
