<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & Elevation" subtitle="모서리 둥글기 · 그림자 3단계" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--gray-50); font-family: var(--font-sans); display: flex; gap: 40px; }
  .label { font-size: 11px; font-weight: 700; color: var(--gray-500); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 56px; height: 44px; background: var(--gray-0); border: 1px solid var(--gray-200); }
  .t { font-family: var(--font-mono); font-size: 10px; color: var(--gray-500); margin-top: 8px; }
  .sbox { width: 64px; height: 44px; background: var(--gray-0); border-radius: var(--radius-md); }
</style>
</head>
<body>
  <div>
    <div class="label">Radius</div>
    <div class="row">
      <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="t">sm 4</div></div>
      <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="t">md 8</div></div>
      <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="t">lg 12</div></div>
      <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="t">xl 16</div></div>
      <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><div class="t">full</div></div>
    </div>
  </div>
  <div>
    <div class="label">Elevation</div>
    <div class="row">
      <div class="item"><div class="sbox" style="box-shadow:var(--shadow-sm)"></div><div class="t">sm</div></div>
      <div class="item"><div class="sbox" style="box-shadow:var(--shadow-md)"></div><div class="t">md</div></div>
      <div class="item"><div class="sbox" style="box-shadow:var(--shadow-lg)"></div><div class="t">lg</div></div>
    </div>
  </div>
</body>
</html>
